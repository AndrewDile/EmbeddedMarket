services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-embedded_market}
      MYSQL_USER: ${DB_USER:-embedded}
      MYSQL_PASSWORD: ${DB_PASSWORD:-embedded}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-embedded-root}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1 FROM bom_items LIMIT 1' $$MYSQL_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  engine:
    build:
      context: ./engine
      target: service
    environment:
      ENGINE_PORT: 8081
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-embedded_market}
      DB_USER: ${DB_USER:-embedded}
      DB_PASSWORD: ${DB_PASSWORD:-embedded}
      ENGINE_URL: http://engine:8081
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
